<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Star</title>
</head>
<body>
<h1 align="center">Add a star</h1>
<p style="text-align: center">
    <a class="btn btn-primary" href="/cs122b-project1-api-example/_dashboard/index.html" role="button">Home</a>
    <a class="btn btn-primary" href="/cs122b-project1-api-example/_dashboard/add-star.html" role="button">Add Star</a>
    <a class="btn btn-primary" href="/cs122b-project1-api-example/_dashboard/add-movie.html" role="button">Add Movie</a>
    <a class="btn btn-primary" href="/cs122b-project1-api-example/MovieBrowse.html" role="button">Browse Movie</a>
</p>
<h2 align="center">New Star Details</h2>

<form action="#" METHOD="POST" id="add_star_form">
    <p style="text-align: center">
        <input TYPE="TEXT" name="star_name" placeholder="Star Name"> <br>
        <input type="number" min="1700" max="2023" step="1" value="" name="year" placeholder="Birth Year"/><br>
        <input TYPE="SUBMIT" VALUE="Add">
    </p>
</form>

<p style="text-align: center">
<div id="add_star_message" style="text-align: center"></div>
</p>

<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!-- include our own JS file -->
<script src="add-star.js"></script>

</body>
</html>
