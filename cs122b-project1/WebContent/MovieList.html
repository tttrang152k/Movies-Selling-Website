<!-- This example is following frontend and backend separation.

    This .html performs two steps:
    1. Create a html template skeleton, with all the elements defined (some left empty) and named with ids.
    2. Load index.js to populate the data into empty elements.
    -->

    <!doctype html>
    <html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
              integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
        <title>Movie Results</title>
    </head>
    <body>

    <h1 class="display-1">Movie Results</h1>
    
    <a class="btn btn-primary" href="/cs122b-project1-api-example/home_page.html" role="button">Home Page</a>
    <a class="btn btn-primary" href="/cs122b-project1-api-example/cart.html" role="button">Checkout</a>
    <a class="btn btn-primary" href="/cs122b-project1-api-example/FulltextSearch.html" role="button">Full-text Search</a>

    <form ACTION="MovieList.html" METHOD="GET" id="search_form">
        <strong>Search by:</strong>
        <input type="text" placeholder="Title" name="movie_title">
        <input type="text" placeholder="Director Name" name="director_name">
        <input type="number" min="2001" max="2019" step="1" value="" placeholder="Year" name="year"/>
        <input type="text" placeholder="Star Name" name="star_name">
        <input type="submit" value="Search">

    </form><br>


    <form ACTION="MovieList.html" METHOD="GET" id="sort_form">
        <select name="sort">
            <option value="1" name="sort">Rating asc, title asc</option>
            <option value="2" name="sort">Rating asc, title desc</option>
            <option value="3" name="sort">Rating desc, title desc</option>
            <option value="4" name="sort">Rating desc, title asc</option>
            <option value="5" name="sort">Title asc, rating asc</option>
            <option value="6" name="sort">Title asc, rating desc</option>
            <option value="7" name="sort">Title desc, rating desc</option>
            <option value="8" name="sort">Title desc, rating asc</option>
        </select>
        <label for="limit-select">Page Limit: </label>
        <select name="result_limit" id="limit-select" form="sort_form" >
            <option value="100" >100</option>
            <option value="50">50</option>
            <option value="25">25</option>
            <option value="10">10</option>
        </select>
        <input type="submit" value="Filter">
    </form>

    
    <!-- Id "movie_table" is useful for jQuery to find the html element with id, class here is mapping to Bootstrap defined class CSS -->
    <table id=movie_table class="table table-striped table-success table-hover">
        <!-- Create a table header -->
        <thead>
        <tr>
            <!-- Titles of each column-->
            <th>Title</th>
            <th>Year</th>
            <th>Director</th>
            <th>Genres</th>
            <th>Stars</th>
            <th>Rating</th>
            <th>Cart</th>

        </tr>
        </thead>
        <!-- Table body is left empty here, will be populated with the data retrieved with index.js -->
        <!-- Again, id "movie_table_body" is useful for jQuery to find this html element -->
        <tbody id=movie_table_body></tbody>
    </table>

    <nav aria-label="Page navigation">
        <ul id=pages class="pagination">
            <li class="page-item"><a class="page-link" onclick="changePage('prev')">Previous</a></li>
        </ul>
    </nav>
    
    <!-- Load jQuery and Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    
    <!-- Load our own JS file -->
    <!-- The path is relative to index.html, since these two files are in the same directory -->
    <!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
         otherwise the url is relative to the root path-->
    <script src="MovieList.js"></script>
    </body>
    
    
    </html>
