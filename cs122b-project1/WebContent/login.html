<!-- This page will be redirected from any url if you are not logged in -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
  integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <title>Login to Fablix</title>
</head>
<body>
<h2 align="center">Login to Fablix</h2>
<!-- Set the method to POST to avoid showing the username/password in the URL
     The default action is disabled to allow your own implementation. -->
<form id="login_form" method="post" action="#">
  <p style="text-align: center">
  <label><b>Username</b></label>
  <label>
    <input name="username" placeholder="Enter Username" type="text">
  </label>
  <br>
  <label><b>Password</b></label>
  <label>
    <input name="password" placeholder="Enter Password" type="password">
  </label>
  <br>
  <input type="submit" value="Login">
  <div style="text-align: center">
    <div class="g-recaptcha" style="display: inline-block" data-sitekey="6LdodeAlAAAAANQGZJjPYuk6oKr0Nja5sG4W0EI4"></div>
  </div>
  </p>
</form>
<p style="text-align: center">
<div id="login_error_message" style="text-align: center" class="alert alert-danger" role="alert" ></div>
</p>
<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!-- Include reCAPTCHA-->
<script src='https://www.google.com/recaptcha/api.js' type="text/javascript"></script>
<!-- include our own JS file -->
<script src="./login.js"></script>
<!-- Load Bootstrap JS -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

</body>
</html>
