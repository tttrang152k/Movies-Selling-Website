<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie Search</title>
</head>

<h1 ALIGN="CENTER">Full-Text Movie Search</h1>
<p style="text-align: center">
    <a class="btn btn-primary" href="/cs122b-project1-api-example/home_page.html" role="button">Home Page</a>
    <a class="btn btn-primary" href="/cs122b-project1-api-example/cart.html" role="button">Checkout</a><br>

<h1 ALIGN="CENTER">Advanced Movie Search</h1>
<p style="text-align: center">
    <strong>Search By:</strong>
</p>
<form ACTION="MovieList.html" METHOD="GET" id="search_form">
    <p style="text-align: center">
        <input TYPE="TEXT" name="movie_title" placeholder="Title"><br>
        <input TYPE="TEXT" name="director_name" placeholder="Director"><br>
        <input type="number" min="2001" max="2019" step="1" value="" name="year" placeholder="Year"/><br>
        <input TYPE="TEXT" name="star_name" placeholder="Star"><br>
        <input TYPE="SUBMIT" VALUE="Search">
    </p>
</form>
